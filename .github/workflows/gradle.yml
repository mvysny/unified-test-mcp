name: Gradle

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # 21 is the floor (--release 21); 25 the newest LTS
        java: [21, 25]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        # no `cache:` — setup-gradle caches Gradle
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    # the tests' first Playwright.create() downloads every browser, 1.3 GB unpacked;
    # Playwright's version comes in through the libraries in libs.versions.toml
    - name: Cache Playwright's browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
    - name: Build with Gradle
      run: ./gradlew --no-daemon --no-watch-fs

  design-docs:
    runs-on: ubuntu-latest
    container: buildpack-deps:scm
    steps:
    - uses: actions/checkout@v7
    - name: Verify design tripwires
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        design/verify_design_tripwires.sh
