[versions]
# the line the Unified API is built and tested against; see design/research.md, R_unified_playwright_packaging
vaadin = "25.3.5"

[libraries]
tinymcpserver = "com.github.mvysny.tinymcpserver:mcp-server:1.0"
unified-test-playwright = "org.vaadin.addons:unified-test-playwright:0.1.0-alpha2"
vaadin-core = { module = "com.vaadin:vaadin-core", version.ref = "vaadin" }
vaadin-dev = { module = "com.vaadin:vaadin-dev", version.ref = "vaadin" }
vaadin-boot = "com.github.mvysny.vaadin-boot:vaadin-boot:13.7"
slf4j-simple = "org.slf4j:slf4j-simple:2.0.20"
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"
junit = "org.junit.jupiter:junit-jupiter-engine:6.1.3"
junit-launcher = "org.junit.platform:junit-platform-launcher:6.1.3"
karibu-testing = "com.github.mvysny.kaributesting:karibu-testing-v24:2.7.3"

[plugins]
vaadin = { id = "com.vaadin", version.ref = "vaadin" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
